name: 'ecommerce_lakehouse'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_lakehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_lakehouse:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: ephemeral
      +tags: ["intermediate"]
    marts:
      core:
        +materialized: table
        +schema: core
        +tags: ["mart", "core"]
        +post-hook:
          - "grant select on {{ this }} to role reporter"
      finance:
        +materialized: table
        +schema: finance
        +tags: ["mart", "finance"]
        +post-hook:
          - "grant select on {{ this }} to role finance_reader"

snapshots:
  ecommerce_lakehouse:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at

vars:
  # Used by the is_incremental() logic and by tests
  start_date: '2022-01-01'
  # dbt-date package
  "dbt_date:time_zone": "UTC"
