---
# Local development stack
# Mirrors the AWS production stack with local equivalents:
#   MinIO     → S3 (Bronze/Silver/Gold buckets)
#   Postgres  → Redshift (for dbt model development)
#   Spark     → EMR (PySpark job development)
#   Airflow   → MWAA (DAG development)
#
# Usage:
#   make local-up    → Start all services
#   make local-down  → Stop and remove containers

version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW_CONN_AWS_DEFAULT: aws://minio:minio123@?endpoint_url=http://minio:9000
    DATA_LAKE_BUCKET: datalake
    ENVIRONMENT: local
    SPARK_ENV: local
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --------------------------------------------------------------------------
  # MinIO — local S3 proxy
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Create buckets on startup
  minio-init:
    image: minio/mc:RELEASE.2024-03-13T23-51-57Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio minio123;
        mc mb --ignore-existing local/datalake;
        mc mb --ignore-existing local/datalake/bronze;
        mc mb --ignore-existing local/datalake/silver;
        mc mb --ignore-existing local/datalake/gold;
        mc mb --ignore-existing local/datalake/quarantine;
        echo 'Buckets ready';
      "

  # --------------------------------------------------------------------------
  # Postgres — Redshift proxy for dbt development
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt_local
      POSTGRES_DB: ecommerce_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Spark — for local PySpark job development
  # --------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5.1
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark/jobs

  spark-worker:
    image: bitnami/spark:3.5.1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ./spark:/opt/spark/jobs

  # --------------------------------------------------------------------------
  # Airflow
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --firstname Admin --lastname User
          --role Admin --email admin@local.dev --password admin
      "

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8090:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  postgres-data:
  airflow-logs:
